# Publishes a GitHub Release with TallyShot.dmg whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The landing page downloads releases/latest/download/TallyShot.dmg.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Test
        run: ./scripts/test.sh

      - name: Import release signing certificate
        env:
          CERT_P12: ${{ secrets.TALLYSHOT_RELEASE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TALLYSHOT_RELEASE_CERT_PASSWORD }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build app
        env:
          SIGNING_IDENTITY_NAME: TallyShot Release Signing
          REQUIRE_SIGNING: "1"
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Verify signature
        run: |
          codesign --verify --strict --verbose=2 dist/TallyShot.app
          codesign -dr - dist/TallyShot.app

      - name: Package dmg
        run: ./scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TallyShot.dmg \
            --title "TallyShot ${GITHUB_REF_NAME#v}" \
            --generate-notes
